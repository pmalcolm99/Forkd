<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Forkd — Offline</title>
    <style>
      :root {
        color-scheme: dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #0a0a0a;
        color: #ededed;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(env(safe-area-inset-top), 24px) 24px max(env(safe-area-inset-bottom), 24px);
        text-align: center;
      }
      .card {
        max-width: 22rem;
      }
      .logo {
        font-size: 2rem;
        font-weight: 700;
        color: #4aab7c;
        margin-bottom: 0.75rem;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #a1a1aa;
        line-height: 1.5;
        margin: 0 0 1.5rem;
      }
      button {
        background: #3d7a52;
        color: #fff;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.7rem 1.4rem;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">Forkd</div>
      <h1>You're offline</h1>
      <p>Forkd needs a connection to load your restaurants. Check your network and try again.</p>
      <button onclick="location.reload()">Retry</button>
    </div>
  </body>
</html>
